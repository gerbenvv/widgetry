name: Demo

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   uses: actions/checkout@v4

            -   name: Assemble the site
                run: |
                    mkdir -p site
                    cp -r demo dist site/

                    # The demo references the bundle as ../dist/.
                    printf '<meta http-equiv="refresh" content="0; url=demo/">\n' > site/index.html

            -   uses: actions/configure-pages@v5

            -   uses: actions/upload-pages-artifact@v3
                with:
                    path: site

            -   id: deployment
                uses: actions/deploy-pages@v4
