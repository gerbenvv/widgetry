name: Release

# Publishes to npm and creates a GitHub release when a version tag (such as v1.0.0) is pushed.
# Publishing needs the NPM_TOKEN secret.
on:
    push:
        tags: ['v*']

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
                    registry-url: https://registry.npmjs.org

            -   run: npm ci

            -   name: Check that the tag matches the package version
                run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

            -   name: Unit tests
                run: npm run test:unit

            -   name: Install the browsers
                run: npx playwright install --with-deps chromium firefox

            -   name: Browser tests
                run: npm run test:browser
                env:
                    CI: true

            -   name: Check that the committed build is up to date
                run: npm run build && npm run types && git add -N dist && git diff --exit-code -- dist

            # The steps above ran what `prepublishOnly` would run again.
            -   name: Publish to npm
                run: npm publish --provenance --access public --ignore-scripts
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # The notes are the section of the changelog for this version.
            -   name: Create the GitHub release
                run: |
                    awk -v version="${GITHUB_REF_NAME#v}" '
                        /^## / { found = $2 == version; next }
                        found { print }
                    ' CHANGELOG.md > release-notes.md
                    test -s release-notes.md
                    gh release create "${GITHUB_REF_NAME}" --title "Widgetry ${GITHUB_REF_NAME}" --notes-file release-notes.md
                env:
                    GH_TOKEN: ${{ github.token }}
