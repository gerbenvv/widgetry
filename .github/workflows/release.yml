name: Release

# Publishes to npm and creates a GitHub release when a version tag (such as v1.0.0) is pushed.
# Publishing needs the NPM_TOKEN secret.
on:
    push:
        tags: ['v*']

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
                    registry-url: https://registry.npmjs.org

            -   run: npm ci

            -   name: Check that the tag matches the package version
                run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

            -   name: Unit tests
                run: npm run test:unit

            -   name: Check that the committed build is up to date
                run: npm run build && npm run types && git diff --exit-code -- dist

            -   name: Publish to npm
                run: npm publish --provenance --access public
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            -   name: Create the GitHub release
                run: gh release create "${GITHUB_REF_NAME}" --title "Widgetry ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
                env:
                    GH_TOKEN: ${{ github.token }}
