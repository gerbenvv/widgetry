name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm

            -   run: npm ci

            -   name: Lint
                run: npm run lint

            -   name: Unit tests
                run: npm run test:unit

            -   name: Install the browsers
                run: npx playwright install --with-deps chromium firefox

            -   name: Browser tests
                run: npm run test:browser

            -   name: Build
                run: npm run build && npm run types

            # Also fails on new files that are not committed, such as the declarations of a new module.
            -   name: Check that the committed build is up to date
                run: git add -N dist && git diff --exit-code -- dist

            -   uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: playwright-report
                    path: test-results/
